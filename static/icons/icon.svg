<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle circular accent -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" />
  
  <!-- Center Soundwave Bars -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Bar -4 -->
    <rect x="-140" y="-35" width="16" height="70" rx="8" fill="url(#glowGrad)" opacity="0.6" />
    <!-- Bar -3 -->
    <rect x="-105" y="-65" width="16" height="130" rx="8" fill="url(#glowGrad)" opacity="0.75" />
    <!-- Bar -2 -->
    <rect x="-70" y="-105" width="16" height="210" rx="8" fill="url(#glowGrad)" opacity="0.9" />
    <!-- Bar -1 -->
    <rect x="-35" y="-140" width="16" height="280" rx="8" fill="url(#glowGrad)" />
    <!-- Center Bar 0 -->
    <rect x="0" y="-170" width="16" height="340" rx="8" fill="#ffffff" />
    <!-- Bar 1 -->
    <rect x="35" y="-135" width="16" height="270" rx="8" fill="url(#glowGrad)" />
    <!-- Bar 2 -->
    <rect x="70" y="-95" width="16" height="190" rx="8" fill="url(#glowGrad)" opacity="0.9" />
    <!-- Bar 3 -->
    <rect x="105" y="-60" width="16" height="120" rx="8" fill="url(#glowGrad)" opacity="0.75" />
    <!-- Bar 4 -->
    <rect x="140" y="-30" width="16" height="60" rx="8" fill="url(#glowGrad)" opacity="0.6" />
  </g>
  
  <!-- Sparkle Accent (Gemini Star) -->
  <path d="M 380,120 Q 380,150 410,150 Q 380,150 380,180 Q 380,150 350,150 Q 380,150 380,120 Z" fill="#38bdf8" filter="url(#glow)" />
</svg>
